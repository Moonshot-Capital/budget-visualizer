<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dein Budget als Balken: Ausgaben eintragen, Überschuss und Sparquote sehen, als PDF oder Story exportieren." />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <title>Visualizer – Budget Visualizer</title>
    <style>
      html { background: #fff }
      html[data-theme="dark"] { background: #0f0f0f }
    </style>
    <script>
      // Theme vor dem ersten Paint setzen – verhindert das weiße Aufblitzen im
      // Dark Mode. "auto" wird hier schon aufgelöst, damit data-theme immer
      // einen konkreten Wert hat (siehe @custom-variant dark in index.css).
      try {
        var s = JSON.parse(localStorage.getItem("myBudget") || "{}");
        var pref = s.theme === "dark" || s.theme === "light" ? s.theme : "auto";
        var isDark = pref === "dark" || (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = isDark ? "dark" : "light";
        if (s.lang === "de" || s.lang === "en") document.documentElement.lang = s.lang;
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <script type="module" crossorigin src="./assets/app-BR0HRZCd.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/SiteFooter-D6nHevdf.js">
    <link rel="modulepreload" crossorigin href="./assets/share-BTulIGoR.js">
    <link rel="stylesheet" crossorigin href="./assets/SiteFooter-Bc9L_Mbk.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
